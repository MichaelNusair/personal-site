name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  # Runs on pull requests AND on pushes to main, so main is never "validated"
  # only in hindsight.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # Prisma types are generated, not checked in — typecheck fails without this.
      - run: npx prisma generate --schema=packages/database/prisma/schema.prisma
      - run: npm run typecheck
      - name: Lint deploy scripts
        run: bash -n scripts/deploy.sh && bash -n deploy.env

  # Deploying is one script, the same one a human runs locally
  # (scripts/deploy.sh). CI does not get its own copy of the build/push/release
  # logic, so the two cannot drift.
  #
  # As of 2026-10-23 this job SKIPS: the repo's AWS_ACCESS_KEY_ID /
  # AWS_SECRET_ACCESS_KEY secrets are present but rejected by STS
  # ("The security token included in the request is invalid" — run 39920590698),
  # so every push to main was failing here. Rather than go red on every commit
  # for a known-missing credential, the job probes the credentials first and, if
  # they do not work, writes a loud summary saying the deploy was skipped and a
  # human has to run scripts/deploy.sh. Rotate the two secrets and this job
  # starts deploying again with no change to this file.
  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # An arm64 runner, because the Lambda is arm64 (TARGET_ARCH in deploy.env)
    # and a cross-build under QEMU is both an hour long and flaky — it is what
    # broke the first attempt at this deploy. Free for public repositories.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        id: creds
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check the credentials actually work
        id: probe
        if: steps.creds.outcome == 'success'
        continue-on-error: true
        run: aws sts get-caller-identity

      - name: Explain the skip
        if: steps.creds.outcome != 'success' || steps.probe.outcome != 'success'
        run: |
          {
            echo "## Deploy skipped — no working AWS credentials"
            echo
            echo "This repository's \`AWS_ACCESS_KEY_ID\` / \`AWS_SECRET_ACCESS_KEY\`"
            echo "secrets are missing or rejected by STS, so CI cannot reach account"
            echo "481432042359. **The live site was not updated by this run.**"
            echo
            echo "To ship this commit, run the deploy by hand:"
            echo
            echo '```sh'
            echo "./scripts/deploy.sh"
            echo '```'
            echo
            echo "Rotate the two secrets to re-enable automatic deploys."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Deploy skipped::No working AWS credentials; run ./scripts/deploy.sh by hand to ship this commit."

      - name: Set up Buildx
        if: steps.probe.outcome == 'success'
        uses: docker/setup-buildx-action@v3

      - name: Build, push and release
        if: steps.probe.outcome == 'success'
        # Empty profile = use the credentials already in the environment.
        # Every other setting comes from deploy.env.
        run: AWS_PROFILE_NAME= ./scripts/deploy.sh

      # NOTE on two steps that used to live here and are deliberately gone:
      #
      # 1. `cdk deploy` — the live Lambda, ECR repo and API Gateway domain are
      #    not in any CloudFormation stack, so a deploy would try to CREATE
      #    them, fail on the taken names, and DELETE the apex/www Route53
      #    records it had already UPSERT-ed on the way in. That is a DNS outage,
      #    not a failed build. See README.md "Infrastructure".
      #
      # 2. `aws s3 sync ./static-assets …` — it wrote to
      #    `_next/static/static/…` (doubled prefix, because `docker cp` brings
      #    the directory along with its name), a path no request ever asks for.
      #    The bucket was never actually serving the site: the Dockerfile copies
      #    `.next/static` into the image and Next's standalone server answers
      #    those requests itself. Updating the Lambda is the whole deploy, and
      #    it is atomic — HTML and its content-hashed chunks ship together.
